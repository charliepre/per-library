<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>教材ライブラリ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f7fa;
      color: #202630;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        sans-serif;
      line-height: 1.7;
    }

    header {
      padding: 64px 20px;
      background: #ffffff;
      border-bottom: 1px solid #dfe4ea;
      text-align: center;
    }

    header h1 {
      margin: 0 0 12px;
      font-size: 2.5rem;
    }

    header p {
      margin: 0;
      color: #667080;
    }

    main {
      width: min(900px, calc(100% - 32px));
      margin: 40px auto;
    }

    section {
      margin-bottom: 24px;
      padding: 28px;
      background: #ffffff;
      border: 1px solid #dfe4ea;
      border-radius: 12px;
    }

    h2 {
      margin-top: 0;
      font-size: 1.4rem;
    }

    .material {
      padding: 18px 0;
      border-top: 1px solid #e5e9ee;
    }

    .material:first-of-type {
      border-top: none;
    }

    .material h3 {
      margin: 0 0 4px;
    }

    .material p {
      margin: 0;
      color: #667080;
    }

    .status {
      display: inline-block;
      margin-top: 10px;
      padding: 4px 10px;
      background: #edf2f7;
      border-radius: 999px;
      color: #5b6572;
      font-size: 0.85rem;
    }

    footer {
      padding: 28px 20px;
      background: #202630;
      color: #dce2e8;
      text-align: center;
      font-size: 0.85rem;
    }

    @media (max-width: 600px) {
      header {
        padding: 44px 20px;
      }

      header h1 {
        font-size: 2rem;
      }

      section {
        padding: 20px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>教材ライブラリ</h1>
    <p>大学数学・試験対策・個別指導用の自作教材を公開しています。</p>
  </header>

  <main>
    <section>
      <h2>このサイトについて</h2>
      <p>
        自作した講義資料、問題集、試験対策資料などを、
        科目別に整理して掲載するためのサイトです。
      </p>
    </section>

    <section>
      <h2>大学数学</h2>

      <div class="material">
        <h3>線形代数入門</h3>
        <p>
          行列、連立一次方程式、行列式、線形写像、
          固有値・対角化などを扱います。
        </p>
        <span class="status">PDF準備中</span>
      </div>
    </section>

    <section>
      <h2>大学試験対策</h2>
      <p>資料を順次掲載する予定です。</p>
    </section>

    <section>
      <h2>個別指導用教材</h2>
      <p>資料を順次掲載する予定です。</p>
    </section>
  </main>

  <footer>
    <p>© 2026 教材ライブラリ</p>
  </footer>
</body>
</html>
