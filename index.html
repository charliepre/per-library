<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>教材ライブラリ</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="site-header">
    <p class="eyebrow">DOCUMENT LIBRARY</p>

    <h1>教材ライブラリ</h1>

    <p class="lead">
      自作した大学受験用教材・大学数学教材などを、
      分類別に掲載しています。
    </p>
  </header>

  <main class="container">
    <div class="category-grid">

      <!-- 大学受験関連 -->
      <a
        class="category-card"
        href="university-entrance-exam.html"
      >
        <div class="category-card-content">
          <span class="category-number">CATEGORY 01</span>

          <h2>大学受験関連</h2>

          <p>
            授業で使用している英語・数学・共通テスト関連の
            教材を掲載しています。
          </p>

          <span class="category-arrow">
            教材一覧を見る →
          </span>
        </div>
      </a>

      <!-- 大学数学 -->
      <a
        class="category-card"
        href="university-math.html"
      >
        <div class="category-card-content">
          <span class="category-number">CATEGORY 02</span>

          <h2>大学数学</h2>

          <p>
            線形代数をはじめとする大学数学の自作教材を
            掲載しています。
          </p>

          <span class="category-arrow">
            教材一覧を見る →
          </span>
        </div>
      </a>

      <!-- その他 -->
      <a
        class="category-card"
        href="other.html"
      >
        <div class="category-card-content">
          <span class="category-number">CATEGORY 03</span>

          <h2>その他</h2>

          <p>
            上記の分類に含まれない教材を順次掲載します。
          </p>

          <span class="category-arrow">
            教材一覧を見る →
          </span>
        </div>
      </a>

    </div>
  </main>

  <footer>
    <p>© 2026 教材ライブラリ</p>
  </footer>
</body>
</html>
