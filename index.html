<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>教材ライブラリ</title>

  <style>
    :root {
      --background: #f5f7fa;
      --surface: #ffffff;
      --text: #202630;
      --muted: #667080;
      --border: #dfe4ea;
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        sans-serif;
      line-height: 1.7;
    }

    header {
      padding: 64px 20px 48px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      text-align: center;
    }

    header h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 5vw, 3rem);
    }

    header p {
      margin: 0;
      color: var(--muted);
    }

    .container {
      width: min(1000px, calc(100% - 32px));
      margin: 0 auto;
    }

    .search-area {
      margin: 32px 0 24px;
      padding: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .search-area label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .search-area input {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font: inherit;
    }

    .search-area input:focus {
      border-color: var(--accent);
      outline: 3px solid rgba(37, 99, 235, 0.12);
    }

    .category-section {
      margin-bottom: 28px;
      padding: 28px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .category-section h2 {
      margin: 0 0 18px;
      font-size: 1.5rem;
    }

    .materials-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 16px;
    }

    .material-card {
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #ffffff;
    }

    .material-card h3 {
      margin: 0 0 8px;
      font-size: 1.15rem;
    }

    .description {
      margin: 0 0 14px;
      color: var(--muted);
    }

    .metadata {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 16px;
    }

    .tag {
      padding: 3px 9px;
      border-radius: 999px;
      background: #edf2f7;
      color: #53606e;
      font-size: 0.78rem;
    }

    .pdf-button {
      display: inline-block;
      padding: 8px 16px;
      background: var(--accent);
      border-radius: 8px;
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
    }

    .pdf-button:hover {
      background: var(--accent-dark);
    }

    .no-results {
      margin: 32px 0;
      padding: 32px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--muted);
      text-align: center;
    }

    footer {
      margin-top: 56px;
      padding: 28px 20px;
      background: var(--text);
      color: #dce2e8;
      text-align: center;
      font-size: 0.85rem;
    }

    @media (max-width: 600px) {
      header {
        padding: 44px 20px 36px;
      }

      .category-section {
        padding: 20px;
      }

      .materials-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>教材ライブラリ</h1>
    <p>大学数学・試験対策・個別指導用の自作教材を公開しています。</p>
  </header>

  <main class="container">
    <div class="search-area">
      <label for="searchInput">教材を検索</label>
      <input
        id="searchInput"
        type="search"
        placeholder="例：線形代数、大学1年、対角化"
        autocomplete="off"
      >
    </div>

    <div id="materialsContainer"></div>

    <p id="noResults" class="no-results" hidden>
      条件に一致する教材がありません。
    </p>
  </main>

  <footer>
    <p>© 2026 教材ライブラリ</p>
  </footer>

  <script src="materials.js"></script>

  <script>
    const materialsContainer =
      document.getElementById("materialsContainer");

    const searchInput =
      document.getElementById("searchInput");

    const noResults =
      document.getElementById("noResults");

   function formatDate(dateString) {
  const parts = dateString.split("-");

  const year = Number(parts[0]);
  const month = Number(parts[1]);
  const day = parts[2] ? Number(parts[2]) : null;

  if (day === null) {
    return `${year}年${month}月`;
  }

  return `${year}年${month}月${day}日`;
}
    function createMaterialCard(material) {
      return `
        <article class="material-card">
          <h3>${material.title}</h3>

          <p class="description">
            ${material.description}
          </p>

          <div class="metadata">
            <span class="tag">${material.subject}</span>
            <span class="tag">${material.level}</span>
            <span class="tag">${material.pages}ページ</span>
            <span class="tag">
              更新：${formatDate(material.updated)}
            </span>
          </div>

          <a
            class="pdf-button"
            href="${material.file}"
            target="_blank"
            rel="noopener"
          >
            PDFを開く
          </a>
        </article>
      `;
    }

    function renderMaterials(keyword = "") {
      const normalizedKeyword =
        keyword.trim().toLowerCase();

      const filteredMaterials = materials.filter((material) => {
        const searchableText = [
          material.title,
          material.category,
          material.subject,
          material.level,
          material.description
        ]
          .join(" ")
          .toLowerCase();

        return searchableText.includes(normalizedKeyword);
      });

      materialsContainer.innerHTML = "";

      const categories = [
        ...new Set(
          filteredMaterials.map(
            (material) => material.category
          )
        )
      ];

      categories.forEach((category) => {
        const categoryMaterials =
          filteredMaterials.filter(
            (material) => material.category === category
          );

        const section =
          document.createElement("section");

        section.className = "category-section";

        section.innerHTML = `
          <h2>${category}</h2>

          <div class="materials-grid">
            ${categoryMaterials
              .map(createMaterialCard)
              .join("")}
          </div>
        `;

        materialsContainer.appendChild(section);
      });

      noResults.hidden = filteredMaterials.length !== 0;
    }

    searchInput.addEventListener("input", () => {
      renderMaterials(searchInput.value);
    });

    renderMaterials();
  </script>
</body>
</html>
